<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UFO Earth">
<meta name="theme-color" content="#3d8fe6">
<title>UFO Earth</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#fff;
    font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent;}
  canvas{display:block;position:fixed;inset:0;}
  #hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;
    padding:calc(env(safe-area-inset-top) + 12px) 18px 0;font-size:18px;font-weight:700;
    text-shadow:0 1px 6px rgba(0,60,120,.7);pointer-events:none;}
  #rot{position:fixed;top:calc(env(safe-area-inset-top) + 44px);left:0;right:0;text-align:center;
    font-size:13px;opacity:.8;display:none;pointer-events:none;text-shadow:0 1px 4px rgba(0,60,120,.7);}
  @media (orientation:portrait){#rot{display:block;}}
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;
    background:rgba(10,40,80,.55);text-align:center;padding:24px;box-sizing:border-box;overflow-y:auto;
    -webkit-overflow-scrolling:touch;touch-action:pan-y;}
  @media (max-height:500px){
    .overlay{padding:12px 24px;}
    .overlay h1{font-size:28px;margin:0 0 4px;}
    .overlay p{margin:4px 0;line-height:1.5;font-size:14px;}
    .overlay button{font-size:17px;padding:9px 30px;margin-top:10px;}
  }
  .overlay h1{font-size:44px;letter-spacing:5px;margin:0 0 10px;color:#fff;text-shadow:0 2px 14px #0a3c78;}
  .overlay p{margin:8px 0;line-height:1.7;max-width:420px;text-shadow:0 1px 6px #0a3c78;}
  .small{font-size:13px;opacity:.8;}
  button{font-size:20px;padding:12px 40px;border-radius:30px;border:1px solid #fff;
    background:rgba(255,255,255,.2);color:#fff;margin-top:18px;touch-action:manipulation;}
  .hidden{display:none !important;}
  #warp{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle,rgba(40,120,255,.35),rgba(0,8,30,.9));transition:opacity .8s;pointer-events:none;}
  #warp.fade{opacity:0;}
  #warpText{font-size:28px;font-weight:700;letter-spacing:3px;text-shadow:0 0 14px #7fdcff;}
  #joy{position:fixed;left:24px;bottom:calc(env(safe-area-inset-bottom) + 28px);width:130px;height:130px;
    border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(255,255,255,.12);}
  #knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;
    background:rgba(255,255,255,.45);pointer-events:none;}
  #joy2{position:fixed;right:24px;bottom:calc(env(safe-area-inset-bottom) + 28px);width:130px;height:130px;
    border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(255,255,255,.12);}
  #knob2{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;
    background:rgba(255,255,255,.45);pointer-events:none;}
</style>
</head>
<body>

<div id="hud">
  <div>SCORE <span id="score">0</span></div>
  <div id="alt">ALT 0</div>
  <div>TIME <span id="time">60</span></div>
</div>
<div id="rot">横向きにするとプレイしやすくなります</div>

<div id="joy"><div id="knob"></div></div>
<div id="joy2"><div id="knob2"></div></div>

<div id="start" class="overlay">
  <h1>UFO EARTH</h1>
  <p>美しい未来の地球を飛び回り、光るリングを集めよう。地上に降りることもできます。</p>
  <p>左のスティック: 移動(視点の向きが前。上下の視点で上下にも進む)　右側をドラッグ: 視点を回す・上下<br>
     右のスティック: 上下で高度を調整(離すと高度を維持)<br>
     PC: WASD / 矢印で移動、マウスドラッグで視点、Space / Shiftで上昇・降下</p>
  <p class="small">ホーム画面に追加すると全画面で遊べます</p>
  <button id="startBtn">スタート</button>
</div>

<div id="over" class="overlay hidden">
  <h1>TIME UP</h1>
  <p>スコア <span id="final" style="font-size:32px;color:#ffe066">0</span></p>
  <button id="restartBtn">もう一度</button>
</div>

<div id="warp" class="hidden"><div id="warpText">ワープ中…</div></div>

<div id="clear" class="overlay hidden">
  <h1>CLEAR</h1>
  <p>スコア <span id="clearScore" style="font-size:32px;color:#ffe066">0</span></p>
  <button id="nextBtn">月へ</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  // ---------- 基本セットアップ ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  document.body.prepend(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.05, 6000);

  scene.add(new THREE.AmbientLight(0xdfeeff, 0.7));
  scene.add(new THREE.HemisphereLight(0xbfe3ff, 0x3a6a2a, 0.5));

  // ---------- 空(グラデーションのドーム) ----------
  const skyMesh = new THREE.Mesh(
    new THREE.SphereGeometry(5000, 32, 16),
    new THREE.ShaderMaterial({
      vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
      fragmentShader: `varying vec3 vP;
        void main(){
          float h = normalize(vP).y;
          vec3 horizon = vec3(0.86, 0.94, 1.0);
          vec3 zenith  = vec3(0.16, 0.5, 0.98);
          float t = smoothstep(-0.05, 0.6, h);
          gl_FragColor = vec4(mix(horizon, zenith, t), 1.0);
        }`,
      side: THREE.BackSide, depthWrite: false
    })
  );
  scene.add(skyMesh);
  const earthSkyMat = skyMesh.material;
  const spaceMat = new THREE.ShaderMaterial({
    vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `varying vec3 vP;
      void main(){
        vec3 d = normalize(vP);
        float h = fract(sin(dot(floor(d * 220.0), vec3(12.9898, 78.233, 37.719))) * 43758.5453);
        float star = step(0.9965, h);
        gl_FragColor = vec4(vec3(0.01, 0.012, 0.025) + vec3(star), 1.0);
      }`,
    side: THREE.BackSide, depthWrite: false
  });

  const marsSkyMat = new THREE.ShaderMaterial({
    vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `varying vec3 vP;
      void main(){
        float h = normalize(vP).y;
        vec3 horizon = vec3(0.95, 0.74, 0.55);
        vec3 zenith = vec3(0.62, 0.42, 0.34);
        gl_FragColor = vec4(mix(horizon, zenith, smoothstep(-0.05, 0.6, h)), 1.0);
      }`,
    side: THREE.BackSide, depthWrite: false
  });

  // 金星の空: 硫酸の雲に覆われた、黄色みを帯びた空
  const venusSkyMat = new THREE.ShaderMaterial({
    vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `varying vec3 vP;
      void main(){
        float h = normalize(vP).y;
        vec3 horizon = vec3(0.98, 0.9, 0.62);
        vec3 zenith = vec3(0.9, 0.76, 0.42);
        gl_FragColor = vec4(mix(horizon, zenith, smoothstep(-0.05, 0.6, h)), 1.0);
      }`,
    side: THREE.BackSide, depthWrite: false
  });

  // 木星の空: 薄いオレンジ色のガスの大気
  const jupiterSkyMat = new THREE.ShaderMaterial({
    vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `varying vec3 vP;
      void main(){
        float h = normalize(vP).y;
        vec3 horizon = vec3(0.95, 0.8, 0.6);
        vec3 zenith = vec3(0.7, 0.5, 0.35);
        gl_FragColor = vec4(mix(horizon, zenith, smoothstep(-0.05, 0.6, h)), 1.0);
      }`,
    side: THREE.BackSide, depthWrite: false
  });

  // 土星の空: 淡い黄色みを帯びた大気
  const saturnSkyMat = new THREE.ShaderMaterial({
    vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `varying vec3 vP;
      void main(){
        float h = normalize(vP).y;
        vec3 horizon = vec3(0.98, 0.92, 0.75);
        vec3 zenith = vec3(0.85, 0.75, 0.55);
        gl_FragColor = vec4(mix(horizon, zenith, smoothstep(-0.05, 0.6, h)), 1.0);
      }`,
    side: THREE.BackSide, depthWrite: false
  });
  // 土星の環: 惑星の赤道面(水平)に広がる、淡い環(通り抜けても当たらない見た目だけの環)
  const saturnRing = new THREE.Mesh(
    new THREE.RingGeometry(260, 440, 160),
    new THREE.MeshBasicMaterial({ color: 0xe8d8b0, transparent: true, opacity: 0.7, side: THREE.DoubleSide, depthWrite: false })
  );
  saturnRing.rotation.x = -Math.PI / 2;
  saturnRing.visible = false;
  scene.add(saturnRing);

  // 天王星の空: 淡い水色の大気
  const uranusSkyMat = new THREE.ShaderMaterial({
    vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `varying vec3 vP;
      void main(){
        float h = normalize(vP).y;
        vec3 horizon = vec3(0.75, 0.95, 1.0);
        vec3 zenith = vec3(0.35, 0.7, 0.9);
        gl_FragColor = vec4(mix(horizon, zenith, smoothstep(-0.05, 0.6, h)), 1.0);
      }`,
    side: THREE.BackSide, depthWrite: false
  });

  // 海王星の空: 深い青の大気
  const neptuneSkyMat = new THREE.ShaderMaterial({
    vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `varying vec3 vP;
      void main(){
        float h = normalize(vP).y;
        vec3 horizon = vec3(0.2, 0.35, 0.75);
        vec3 zenith = vec3(0.02, 0.06, 0.25);
        gl_FragColor = vec4(mix(horizon, zenith, smoothstep(-0.05, 0.6, h)), 1.0);
      }`,
    side: THREE.BackSide, depthWrite: false
  });

  // ---------- 地形ノイズ ----------
  function noise3(x, y, z) {
    return Math.sin(x * 1.7 + Math.sin(y * 2.1 + z * 1.3) * 1.6) * 0.5
         + Math.sin(y * 2.9 + Math.sin(z * 1.9 + x * 2.3) * 1.4) * 0.3
         + Math.sin(z * 3.9 + Math.sin(x * 3.1 + y * 1.7) * 1.2) * 0.15
         + Math.cos(x * 5.3 + y * 4.1 - z * 3.3) * 0.08;
  }

  // 地球の大きさ: 直径を前の2倍(半径200)
  const PLANET_R = 200;
  const HS = 10;          // 起伏のスケール(前の半分)

  // 今いるステージ: "earth" または "moon"
  let stage = "earth";
  function smoothstep01(a, b, v) { const s = clamp01((v - a) / (b - a)); return s * s * (3 - 2 * s); }
  // 月の地形: ゆるやかな起伏と、くぼんだクレーター(海はない)
  function moonH(x, y, z) {
    const base = 0.2 + 0.25 * noise3(x * 1.6, y * 1.6, z * 1.6) + 0.08 * noise3(x * 6, y * 6, z * 6);
    const crater = smoothstep01(0.45, 0.9, noise3(x * 3.5 + 7, y * 3.5, z * 3.5 - 4));
    // 地球と同じ周波数帯の細かい起伏を重ねる
    const detail = noise3(x * 12, y * 12, z * 12) * 0.12 + noise3(x * 30, y * 30, z * 30) * 0.03
                 + noise3(x * 70, y * 70, z * 70) * 0.008
                 + noise3(x * 160, y * 160, z * 160) * 0.003;
    return base - 0.5 * crater + detail;
  }
  function moonColor(h, x, y, z) {
    const v = 0.85 + 0.15 * noise3(x * 25, y * 25, z * 25);
    const g = clamp01(0.42 + 0.35 * h) * v;
    return [g, g, g * 0.98];
  }

  // 火星の地形: 月より起伏が大きく、丘と谷が目立つ
  function marsH(x, y, z) {
    return moonH(y * 1.2 + 11, z * 1.2 - 5, x * 1.2 + 2) * 1.2;
  }
  // 火星の色: 赤茶色の砂と岩
  function marsColor(h, x, y, z) {
    const v = 0.85 + 0.15 * noise3(x * 25, y * 25, z * 25);
    const g = clamp01(0.35 + 0.35 * h) * v;
    return [Math.min(1, g * 1.35), g * 0.62, g * 0.42];
  }

  // 金星の地形: 火山の平原が広がる、なだらかな地形
  function venusH(x, y, z) {
    return moonH(z * 1.4 + 3, x * 1.4 - 8, y * 1.4) * 0.9;
  }
  // 金星の色: 黄褐色の火山性の岩
  function venusColor(h, x, y, z) {
    const v = 0.88 + 0.12 * noise3(x * 25, y * 25, z * 25);
    const g = clamp01(0.45 + 0.3 * h) * v;
    return [Math.min(1, g * 1.15), g * 0.95, g * 0.6];
  }

  // 水星の地形: 大小のクレーターだらけの、起伏の強い地形
  function mercuryH(x, y, z) {
    const big = moonH(x * 1.5 + 4, y * 1.5 - 2, z * 1.5 + 9);
    const small = noise3(x * 40 + 1, y * 40 - 3, z * 40 + 5) * 0.05;
    return big + small;
  }
  // 水星の色: 灰色がかった茶色の岩肌
  function mercuryColor(h, x, y, z) {
    const v = 0.86 + 0.14 * noise3(x * 25, y * 25, z * 25);
    const g = clamp01(0.4 + 0.3 * h) * v;
    return [g * 1.05, g * 0.98, g * 0.9];
  }

  // 木星の地形: ガスの雲の表面。ほぼ平らで、わずかなうねりだけ
  function jupiterH(x, y, z) {
    return 0.02 + 0.02 * noise3(x * 3, y * 3, z * 3);
  }
  // 木星の色: クリーム色と茶色の縞模様、大赤斑
  function jupiterColor(h, x, y, z) {
    const band = Math.sin(y * 16 + noise3(x * 3, y * 3, z * 3) * 1.5);  // 縞(緯度に沿って)
    const t = 0.5 + 0.5 * band;
    let r = 0.92 * (1 - t) + 0.68 * t, g = 0.82 * (1 - t) + 0.45 * t, b = 0.62 * (1 - t) + 0.3 * t;
    // 大赤斑(楕円の代わりに、中心からの距離で描く)
    const dx = x - 0.604, dy = y + 0.372, dz = z - 0.705;
    if (Math.hypot(dx, dy, dz) < 0.18) { r = 0.78; g = 0.32; b = 0.22; }
    const v = 0.95 + 0.05 * noise3(x * 25, y * 25, z * 25);
    return [r * v, g * v, b * v];
  }

  // 土星の色: 淡い黄土色の縞模様(大赤斑はない)
  function saturnColor(h, x, y, z) {
    const band = Math.sin(y * 18 + noise3(x * 3, y * 3, z * 3) * 1.2);
    const t = 0.5 + 0.5 * band;
    const r = 0.95 * (1 - t) + 0.85 * t, g = 0.86 * (1 - t) + 0.72 * t, b = 0.62 * (1 - t) + 0.45 * t;
    const v = 0.95 + 0.05 * noise3(x * 25, y * 25, z * 25);
    return [r * v, g * v, b * v];
  }

  // 天王星の色: 淡い水色の、ほとんど縞のないガスの表面
  function uranusColor(h, x, y, z) {
    const band = Math.sin(y * 8 + noise3(x * 2, y * 2, z * 2) * 0.8);
    const t = 0.5 + 0.5 * band;
    const r = 0.6 * (1 - t) + 0.7 * t, g = 0.9 * (1 - t) + 0.95 * t, b = 0.95 * (1 - t) + 1.0 * t;
    const v = 0.97 + 0.03 * noise3(x * 25, y * 25, z * 25);
    return [r * v, g * v, b * v];
  }

  // 海王星の色: 深い青の、縞の少ないガスの表面
  function neptuneColor(h, x, y, z) {
    const band = Math.sin(y * 6 + noise3(x * 2, y * 2, z * 2) * 0.8);
    const t = 0.5 + 0.5 * band;
    const r = 0.1 * (1 - t) + 0.2 * t, g = 0.25 * (1 - t) + 0.4 * t, b = 0.7 * (1 - t) + 0.9 * t;
    const v = 0.95 + 0.05 * noise3(x * 25, y * 25, z * 25);
    return [r * v, g * v, b * v];
  }

  // 単位方向ベクトルの地表の高さ(海は負)、UFOの単位に換算する前の値
  function terrainH(x, y, z) {
    if (stage === "moon") return moonH(x, y, z);
    if (stage === "mars") return marsH(x, y, z);
    if (stage === "venus") return venusH(x, y, z);
    if (stage === "mercury") return mercuryH(x, y, z);
    if (stage === "jupiter" || stage === "saturn" || stage === "uranus" || stage === "neptune") return jupiterH(x, y, z);
    const n = noise3(x * 2.2, y * 2.2, z * 2.2);
    // 陸の高さ(起伏あり)
    const base = (n - 0.05) * 0.8;
    const detail = noise3(x * 12, y * 12, z * 12) * 0.12 + noise3(x * 30, y * 30, z * 30) * 0.03
                 + noise3(x * 70, y * 70, z * 70) * 0.008
                 + noise3(x * 160, y * 160, z * 160) * 0.003;
    const landH = 0.05 + base + detail;
    // 海底(ゆるやかな深さ)
    const seaH = -0.3 + noise3(x * 9, y * 9, z * 9) * 0.05;
    // 境目を滑らかにつなぐ(n が 0〜0.1 の間で、海底から陸へ緩やかに移り変わる)
    const s = clamp01((n - 0.0) / 0.1);
    const w = s * s * (3 - 2 * s); // smoothstep
    return seaH + (landH - seaH) * w;
  }
  function clamp01(v) { return Math.max(0, Math.min(1, v)); }
  // 地表の半径(中心からの距離)
  function surfaceR(x, y, z) {
    const l = Math.hypot(x, y, z);
    return PLANET_R + terrainH(x / l, y / l, z / l) * HS;
  }

  // 高さに応じた色(砂浜・草原・深い緑・岩肌・雪)
  function colorFor(h, x, y, z) {
    const v = 0.92 + 0.08 * noise3(x * 25, y * 25, z * 25);
    let r, g, b;
    if (h < 0.12)      { r = 232; g = 214; b = 160; }
    else if (h < 0.6)  { r = 140; g = 220; b = 80; }
    else if (h < 0.95) { r = 60;  g = 175; b = 70; }
    else if (h < 1.25) { r = 140; g = 120; b = 96; }
    else               { r = 240; g = 244; b = 250; }
    return [r * v / 255, g * v / 255, b * v / 255];
  }

  // ---------- 地球(高精細な地形メッシュ) ----------
  const earthGeo = new THREE.SphereGeometry(1, 1300, 1300);
  {
    const p = earthGeo.attributes.position;
    const col = new Float32Array(p.count * 3);
    for (let i = 0; i < p.count; i++) {
      let x = p.getX(i), y = p.getY(i), z = p.getZ(i);
      const l = Math.hypot(x, y, z); x /= l; y /= l; z /= l;
      const h = terrainH(x, y, z);
      const R = PLANET_R + Math.max(h * HS, -0.3 * HS);
      p.setXYZ(i, x * R, y * R, z * R);
      col.set(colorFor(h, x, y, z), i * 3);
    }
    p.needsUpdate = true;
    earthGeo.setAttribute("color", new THREE.BufferAttribute(col, 3));
    earthGeo.computeVertexNormals();
  }
  // 高精細な表面の質感(頂点を増やさずに、細かい粒状の陰影を重ねる)
  const detailTex = (() => {
    const W = 2048, H = 1024;
    const c = document.createElement("canvas"); c.width = W; c.height = H;
    const ctx = c.getContext("2d"); const img = ctx.createImageData(W, H);
    for (let y = 0; y < H; y++) {
      const lat = Math.PI * (0.5 - y / H), cl = Math.cos(lat), sl = Math.sin(lat);
      for (let x = 0; x < W; x++) {
        const lon = 2 * Math.PI * x / W;
        const px = cl * Math.cos(lon), py = sl, pz = cl * Math.sin(lon);
        const n = noise3(px * 180, py * 180, pz * 180) * 0.6 + noise3(px * 420, py * 420, pz * 420) * 0.4;
        const v = Math.round(255 * Math.max(0.78, Math.min(1, 0.9 + n * 0.12)));
        const i = (y * W + x) * 4;
        img.data[i] = v; img.data[i + 1] = v; img.data[i + 2] = v; img.data[i + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);

  function setupAmbience() {
    const ctx = audioCtx;

    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;

    const noiseLoop = (type, freq, q) => {
      const src = ctx.createBufferSource();
      src.buffer = buf; src.loop = true;
      const f = ctx.createBiquadFilter();
      f.type = type; f.frequency.value = freq; f.Q.value = q;
      const g = ctx.createGain();
      g.gain.value = 0;
      src.connect(f).connect(g).connect(ctx.destination);
      src.start();
      return g;
    };
    const seaG = noiseLoop("lowpass", 700, 0.7);   // 波の音
    const windG = noiseLoop("bandpass", 1400, 0.5); // 風の音

    // 波が寄せては返すゆっくりした揺れ
    const lfo = ctx.createOscillator();
    lfo.frequency.value = 0.12;
    const lfoGain = ctx.createGain();
    lfoGain.gain.value = 0.15;
    lfo.connect(lfoGain).connect(seaG.gain);
    lfo.start();

  }

      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(base, start);
      o.frequency.exponentialRampToValueAtTime(base * 1.4, start + 0.08);
      g.gain.setValueAtTime(0.0001, start);
      g.gain.exponentialRampToValueAtTime(0.04, start + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, start + 0.14);
      o.connect(g).connect(audioCtx.destination);
      o.start(start);
      o.stop(start + 0.16);
    }
  }

  const trailIdx = new Uint16Array((TRAIL_N - 1) * 6);
  for (let i = 0, k = 0; i < TRAIL_N - 1; i++, k += 6) {

    trailIdx.set([a, a + 1, a + 2, a + 1, a + 3, a + 2], k);

  const trailGeo = new THREE.BufferGeometry();
  trailGeo.setAttribute("position", new THREE.BufferAttribute(trailVerts, 3));

  const trail = new THREE.Mesh(trailGeo, new THREE.MeshBasicMaterial({

  const trailSide = new THREE.Vector3(), trailTan = new THREE.Vector3(), trailToCam = new THREE.Vector3();
  function updateTrailMesh(scale = 1) {
    for (let i = 0; i < TRAIL_N; i++) {
      const p = trailPts[i];
      const prev = trailPts[Math.max(0, i - 1)], next = trailPts[Math.min(TRAIL_N - 1, i + 1)];
      trailTan.subVectors(next, prev);

      if (trailSide.lengthSq() < 1e-9) trailSide.set(1, 0, 0);
      trailSide.normalize();

      const a = (p.x + trailSide.x * w), b = (p.y + trailSide.y * w), c = (p.z + trailSide.z * w);
      trailVerts.set([a, b, c], i * 6);
      trailVerts.set([2 * p.x - a, 2 * p.y - b, 2 * p.z - c], i * 6 + 3);
    }
    trailGeo.attributes.position.needsUpdate = true;
  }

  function startWarp(target) {
    clearEl.classList.add("hidden");
    warpTarget = target; warpT = 0; warpPhase = "pull"; state = "warp";
    trail.visible = false;
  }
  function updateWarp(dt) {
    warpT += dt;
    if (warpPhase === "pull") {
      // カメラが、UFOから徐々に離れていく(なめらかに)
      const k = Math.min(1, warpT / WARP_PULL_TIME);
      const e = k * k * (3 - 2 * k);
      const dir = ufo.position.clone().normalize();
      camera.position.copy(ufo.position).addScaledVector(dir, 6 + 40 * e).addScaledVector(camHeading, -(14 + 70 * e));
      camera.lookAt(ufo.position);
      if (k >= 1) { warpPhase = "hold"; warpT = 0; }
    } else if (warpPhase === "hold") {
      // カメラもUFOも静止したまま、少し間をおく
      camera.lookAt(ufo.position);
      if (warpT >= WARP_HOLD_TIME) {
        warpPhase = "rise"; warpT = 0;
        warpLook.copy(ufo.position);
        trailPts.forEach(v => v.copy(ufo.position));
        trail.visible = true;
      }
    } else if (warpPhase === "rise") {
      // カメラは止まったまま、UFOが急上昇する(上昇速度は以前の約10倍)
      const k = Math.min(1, warpT / WARP_RISE_TIME);
      const pr = ufo.position.length();
      const dir = ufo.position.clone().divideScalar(pr);
      const speed = 2800;                           // 静止状態からいきなり高速で上昇
      ufo.position.copy(dir).multiplyScalar(pr + speed * dt);
      ufo.updateMatrixWorld(true);
      // 軌跡: 古い点を一つずらして、今の位置を先頭(新しい側)に追加
      for (let i = 0; i < TRAIL_N - 1; i++) trailPts[i].copy(trailPts[i + 1]);
      trailPts[TRAIL_N - 1].copy(ufo.position);
      updateTrailMesh();
      camera.lookAt(warpLook);
      if (k >= 1) { warpPhase = "fade"; warpT = 0; }
    } else if (warpPhase === "fade") {
      // UFOが飛び去ってから0.05秒かけて、軌跡が細くなって消える
      const f = Math.min(1, warpT / 0.05);
      updateTrailMesh(1 - f);
      if (f >= 1) { warpPhase = "load"; startLoad(); }
    }
  }
  // 次の星の読み込み中は「ワープ中…」を表示する
  function startLoad() {
    warpEl.classList.remove("hidden", "fade");
    warpTextEl.textContent = "ワープ中…";
    setTimeout(() => {
      trail.visible = false;
      goToStage(warpTarget);          // ここでゲームが再開する
      warpEl.classList.add("fade");
      setTimeout(() => warpEl.classList.add("hidden"), 900);
    }, 150);
  }
  nextBtn.addEventListener("click", () => startWarp(NEXT_STAGE[stage]));

  function startGame() {
    ensureAudio();
    score = 0; timeLeft = 60; vz = 0;
    // 地表の少し上、地球の表側からスタート(地表に沿って飛べる向き)
    const sd = new THREE.Vector3(0, 0, 1);
    ufo.position.copy(sd).multiplyScalar(surfaceR(0, 0, 1) + 6);
    heading.set(1, 0, 0); camHeading.set(1, 0, 0); camPitch = 0.35;
    moveH.set(1, 0, 0); movePitch = 0;
    ufo.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(
      new THREE.Vector3(0, -1, 0), new THREE.Vector3(0, 0, 1), new THREE.Vector3(-1, 0, 0)));
    resetRoute();
    state = "playing";
    startEl.classList.add("hidden");
    overEl.classList.add("hidden");
  }
  function endGame() {
    state = "over";
    finalEl.textContent = score;
    overEl.classList.remove("hidden");
  }
  document.getElementById("startBtn").addEventListener("click", startGame);
  document.getElementById("restartBtn").addEventListener("click", startGame);
  addEventListener("keydown", e => { if (e.code === "Enter" && state !== "playing") startGame(); });

  // ---------- 更新 ----------
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const k = (...codes) => codes.some(c => keys[c]);

  // Sky風の操作: 移動はカメラの向き基準、右側のドラッグで視点を回す、Spaceで上昇
  function update(dt) {
    const ix = clamp((k("ArrowRight", "KeyD") ? 1 : 0) - (k("ArrowLeft", "KeyA") ? 1 : 0) + joy.x, -1, 1);
    const iy = clamp((k("ArrowUp", "KeyW") ? 1 : 0) - (k("ArrowDown", "KeyS") ? 1 : 0) - joy.y, -1, 1);
    const vIn = clamp((k("Space") ? 1 : 0) - (k("ShiftLeft", "ShiftRight") ? 1 : 0) - joy2.y, -1, 1);

    // 現在地の上方向(地表の法線)と、カメラの水平方向
    const pr = ufo.position.length();
    const up = ufo.position.clone().divideScalar(pr);
    lastUp.copy(up);
    const ground = surfaceR(up.x, up.y, up.z);
    const alt = pr - ground;

    const view = camHeading.clone().addScaledVector(up, -camHeading.dot(up));
    if (view.lengthSq() < 1e-6) view.set(1, 0, 0).addScaledVector(up, -up.x);
    view.normalize();
    camHeading.copy(view);

    // 不感帯: 視点が移動の向きから上下左右それぞれ±30°以内なら、移動の向きは変わらない。
    // 30°を超えた分だけ、移動の向きが視点に追従する。
    const DEAD = 30 * Math.PI / 180;
    moveH.addScaledVector(up, -moveH.dot(up));
    if (moveH.lengthSq() < 1e-6) moveH.copy(view);
    moveH.normalize();
    const yawDiff = Math.atan2(new THREE.Vector3().crossVectors(moveH, view).dot(up), moveH.dot(view));
    const yawExcess = yawDiff - clamp(yawDiff, -DEAD, DEAD);
    if (yawExcess !== 0) moveH.applyAxisAngle(up, yawExcess);
    movePitch = clamp(movePitch, camPitch - DEAD, camPitch + DEAD);

    const right = new THREE.Vector3().crossVectors(moveH, up);

    // 前方向は移動の向きに合わせて上下も向く(見下ろすと下へ、見上げると上へ進む)
    const fwd3 = moveH.clone().multiplyScalar(Math.cos(movePitch)).addScaledVector(up, -Math.sin(movePitch));
    const moveDir = new THREE.Vector3().addScaledVector(fwd3, iy).addScaledVector(right, ix);
    const mag = Math.min(1, moveDir.length());
    const moving = mag > 0.05;
    if (moving) moveDir.normalize();
    // 進行方向を、地表に沿う成分(水平)と、上下の成分(高度)に分ける
    const radialMove = moving ? moveDir.dot(up) : 0;
    const tangentMove = moveDir.clone().addScaledVector(up, -radialMove);

    // 機体の向きは進行方向へ回る
    if (moving) heading.lerp(moveDir, Math.min(1, dt * 6));
    heading.addScaledVector(up, -heading.dot(up));
    if (heading.lengthSq() < 1e-6) heading.copy(view);
    heading.normalize();

    // 水平移動(球面に沿って動き、高さは保つ)
    let hs = 80 * mag;
    if (alt < 2.5) hs *= 0.5; // 地表近くはゆっくり(着陸しやすい)
    if (moving) {
      ufo.position.copy(ufo.position.clone().addScaledVector(tangentMove, hs * dt).normalize().multiplyScalar(pr));
    }

    // 上昇・降下(右スティック + 上下の視点に合わせた前進の高度成分)
    const vTarget = vIn * 80 + radialMove * hs;
    vz += (vTarget - vz) * Math.min(1, dt * 4); // 離すと高度を維持
    const p2 = ufo.position.length();
    const u2 = ufo.position.clone().divideScalar(p2);
    let r2 = p2 + vz * dt;
    const minR = surfaceR(u2.x, u2.y, u2.z) + 0.45;
    if (r2 < minR) { r2 = minR; vz = 0; } // 着陸
    if (r2 > PLANET_R + 90) { r2 = PLANET_R + 90; vz = Math.min(vz, 0); }
    ufo.position.copy(u2).multiplyScalar(r2);

    // 機体の姿勢(地表の上方向を保ち、進行方向を向く)
    const u3 = ufo.position.clone().normalize();
    const fwd = heading.clone().addScaledVector(u3, -heading.dot(u3)).normalize();
    const zAxis = fwd.clone().negate();
    const xAxis = new THREE.Vector3().crossVectors(u3, zAxis).normalize();
    const targetQ = new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(xAxis, u3, zAxis));
    ufo.quaternion.slerp(targetQ, Math.min(1, dt * 8));
    ufo.updateMatrixWorld(true);

    // リング取得
    const got = rings.filter(m => ufo.position.distanceTo(m.position) < 10.4);
    rings.forEach(m => m.rotateZ(dt * 0.8));
    got.forEach(m => {
      score += 100;
      // リングを取っても制限時間は増えない
      playCollect();
      recycleRing(m);
    });

    // カメラ: UFOの周りを、ドラッグで決めた角度で追従(地表より下に入らない)
    const camUp = ufo.position.clone().normalize();
    const camDist = 9;
    const offset = camHeading.clone().multiplyScalar(-Math.cos(camPitch) * camDist)
      .addScaledVector(camUp, Math.sin(camPitch) * camDist);
    camera.position.lerp(ufo.position.clone().add(offset), Math.min(1, dt * 8));
    const cr = camera.position.length();
    const cd = camera.position.clone().divideScalar(cr);
    const cg = surfaceR(cd.x, cd.y, cd.z) + 0.6;
    if (cr < cg) camera.position.setLength(cg);
    camera.up.copy(camUp);
    camera.lookAt(ufo.position);

    // 時間
    timeLeft -= dt;
    if (timeLeft <= 0) { timeLeft = 0; endGame(); }
    if (state === "playing" && score >= CLEAR_SCORE) showClear();
    scoreEl.textContent = score;
    timeEl.textContent = Math.ceil(timeLeft);
    altEl.textContent = alt < 0.9 ? "着陸中" : "ALT " + Math.round(alt * 10) / 10;
    updateAmbience(dt, up, alt);
  }

  // ---------- 描画ループ ----------
  const clock = new THREE.Clock();
  let elapsed = 0;
  function loop() {
    requestAnimationFrame(loop);
    const dt = Math.min(clock.getDelta(), 0.05);
    elapsed += dt;


    if (state === "playing") {
      update(dt);
    } else if (state === "warp") {
      updateWarp(dt);
    } else {
      // 待機中は地球の周りをゆっくり回るカメラ
      camera.position.set(Math.sin(elapsed * 0.15) * 560, 180, Math.cos(elapsed * 0.15) * 560);
      camera.lookAt(0, 0, 0);
    }
    renderer.render(scene, camera);
  }
  loop();

  // ---------- ユーティリティ ----------
  function randDir() {
    const v = new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5);
    if (v.lengthSq() < 0.01) v.set(0, 1, 0);
    return v.normalize();
  }

  addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
})();
</script>
