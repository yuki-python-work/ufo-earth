<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UFO Earth">
<meta name="theme-color" content="#3d8fe6">
<title>UFO Earth</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#fff;
    font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent;}
  canvas{display:block;position:fixed;inset:0;}
  #hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;
    padding:calc(env(safe-area-inset-top) + 12px) 18px 0;font-size:18px;font-weight:700;
    text-shadow:0 1px 6px rgba(0,60,120,.7);pointer-events:none;}
  #rot{position:fixed;top:calc(env(safe-area-inset-top) + 44px);left:0;right:0;text-align:center;
    font-size:13px;opacity:.8;display:none;pointer-events:none;text-shadow:0 1px 4px rgba(0,60,120,.7);}
  @media (orientation:portrait){#rot{display:block;}}
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;
    background:rgba(10,40,80,.55);text-align:center;padding:24px;box-sizing:border-box;overflow-y:auto;
    -webkit-overflow-scrolling:touch;touch-action:pan-y;}
  @media (max-height:500px){
    .overlay{padding:12px 24px;}
    .overlay h1{font-size:28px;margin:0 0 4px;}
    .overlay p{margin:4px 0;line-height:1.5;font-size:14px;}
    .overlay button{font-size:17px;padding:9px 30px;margin-top:10px;}
  }
  .overlay h1{font-size:44px;letter-spacing:5px;margin:0 0 10px;color:#fff;text-shadow:0 2px 14px #0a3c78;}
  .overlay p{margin:8px 0;line-height:1.7;max-width:420px;text-shadow:0 1px 6px #0a3c78;}
  .small{font-size:13px;opacity:.8;}
  button{font-size:20px;padding:12px 40px;border-radius:30px;border:1px solid #fff;
    background:rgba(255,255,255,.2);color:#fff;margin-top:18px;touch-action:manipulation;}
  .hidden{display:none !important;}
  #joy{position:fixed;left:24px;bottom:calc(env(safe-area-inset-bottom) + 28px);width:130px;height:130px;
    border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(255,255,255,.12);}
  #knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;
    background:rgba(255,255,255,.45);pointer-events:none;}
  #joy2{position:fixed;right:24px;bottom:calc(env(safe-area-inset-bottom) + 28px);width:130px;height:130px;
    border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(255,255,255,.12);}
  #knob2{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;
    background:rgba(255,255,255,.45);pointer-events:none;}
</style>
</head>
<body>

<div id="hud">
  <div>SCORE <span id="score">0</span></div>
  <div id="alt">ALT 0</div>
  <div>TIME <span id="time">60</span></div>
</div>
<div id="rot">横向きにするとプレイしやすくなります</div>

<div id="joy"><div id="knob"></div></div>
<div id="joy2"><div id="knob2"></div></div>

<div id="start" class="overlay">
  <h1>UFO EARTH</h1>
  <p>美しい未来の地球を飛び回り、光るリングを集めよう。地上に降りることもできます。</p>
  <p>左のスティック: 移動(カメラの向きが前)　右側をドラッグ: 視点を回す<br>
     右のスティック: 上下で高度を調整(離すと高度を維持)<br>
     PC: WASD / 矢印で移動、マウスドラッグで視点、Space / Shiftで上昇・降下</p>
  <p class="small">ホーム画面に追加すると全画面で遊べます</p>
  <button id="startBtn">スタート</button>
</div>

<div id="over" class="overlay hidden">
  <h1>TIME UP</h1>
  <p>スコア <span id="final" style="font-size:32px;color:#ffe066">0</span></p>
  <button id="restartBtn">もう一度</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  // ---------- 基本セットアップ ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  document.body.prepend(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.05, 1000);

  scene.add(new THREE.AmbientLight(0xdfeeff, 0.7));
  scene.add(new THREE.HemisphereLight(0xbfe3ff, 0x3a6a2a, 0.5));

  // ---------- 空(グラデーションのドーム) ----------
  scene.add(new THREE.Mesh(
    new THREE.SphereGeometry(900, 32, 16),
    new THREE.ShaderMaterial({
      vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
      fragmentShader: `varying vec3 vP;
        void main(){
          float h = normalize(vP).y;
          vec3 horizon = vec3(0.86, 0.94, 1.0);
          vec3 zenith  = vec3(0.16, 0.5, 0.98);
          float t = smoothstep(-0.05, 0.6, h);
          gl_FragColor = vec4(mix(horizon, zenith, t), 1.0);
        }`,
      side: THREE.BackSide, depthWrite: false
    })
  ));

  // ---------- 地形ノイズ ----------
  function noise3(x, y, z) {
    return Math.sin(x * 1.7 + Math.sin(y * 2.1 + z * 1.3) * 1.6) * 0.5
         + Math.sin(y * 2.9 + Math.sin(z * 1.9 + x * 2.3) * 1.4) * 0.3
         + Math.sin(z * 3.9 + Math.sin(x * 3.1 + y * 1.7) * 1.2) * 0.15
         + Math.cos(x * 5.3 + y * 4.1 - z * 3.3) * 0.08;
  }

  // 地球の大きさ: 直径を前の2倍(半径200)
  const PLANET_R = 200;
  const HS = 20;          // 起伏のスケール(地球の大きさに合わせる)

  // 単位方向ベクトルの地表の高さ(海は負)、UFOの単位に換算する前の値
  function terrainH(x, y, z) {
    const n = noise3(x * 2.2, y * 2.2, z * 2.2);
    if (n < 0.05) return -0.3 + noise3(x * 9, y * 9, z * 9) * 0.05;
    const base = (n - 0.05) * 0.8;
    const detail = noise3(x * 12, y * 12, z * 12) * 0.12 + noise3(x * 30, y * 30, z * 30) * 0.03
                 + noise3(x * 70, y * 70, z * 70) * 0.008
                 + noise3(x * 160, y * 160, z * 160) * 0.003;
    return 0.05 + base + detail;
  }
  // 地表の半径(中心からの距離)
  function surfaceR(x, y, z) {
    const l = Math.hypot(x, y, z);
    return PLANET_R + terrainH(x / l, y / l, z / l) * HS;
  }

  // 高さに応じた色(砂浜・草原・深い緑・岩肌・雪)
  function colorFor(h, x, y, z) {
    const v = 0.92 + 0.08 * noise3(x * 25, y * 25, z * 25);
    let r, g, b;
    if (h < 0.12)      { r = 232; g = 214; b = 160; }
    else if (h < 0.6)  { r = 140; g = 220; b = 80; }
    else if (h < 0.95) { r = 60;  g = 175; b = 70; }
    else if (h < 1.25) { r = 140; g = 120; b = 96; }
    else               { r = 240; g = 244; b = 250; }
    return [r * v / 255, g * v / 255, b * v / 255];
  }

  // ---------- 地球(高精細な地形メッシュ) ----------
  const earthGeo = new THREE.SphereGeometry(1, 1000, 1000);
  {
    const p = earthGeo.attributes.position;
    const col = new Float32Array(p.count * 3);
    for (let i = 0; i < p.count; i++) {
      let x = p.getX(i), y = p.getY(i), z = p.getZ(i);
      const l = Math.hypot(x, y, z); x /= l; y /= l; z /= l;
      const h = terrainH(x, y, z);
      const R = PLANET_R + Math.max(h * HS, -0.3 * HS);
      p.setXYZ(i, x * R, y * R, z * R);
      col.set(colorFor(h, x, y, z), i * 3);
    }
    p.needsUpdate = true;
    earthGeo.setAttribute("color", new THREE.BufferAttribute(col, 3));
    earthGeo.computeVertexNormals();
  }
  const earth = new THREE.Mesh(earthGeo, new THREE.MeshPhongMaterial({ vertexColors: true, shininess: 8, specular: 0x222222 }));
  scene.add(earth);

  // 海面
  const sea = new THREE.Mesh(
    new THREE.SphereGeometry(PLANET_R, 256, 256),
    new THREE.MeshPhongMaterial({ color: 0x2fd3d8, transparent: true, opacity: 0.75, shininess: 90, specular: 0xdffbff })
  );
  scene.add(sea);


  // 大気の輝き
  scene.add(new THREE.Mesh(
    new THREE.SphereGeometry(PLANET_R + 24, 64, 64),
    new THREE.ShaderMaterial({
      vertexShader: `varying vec3 vN;
        void main(){ vN = normalize(normalMatrix * normal);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `varying vec3 vN;
        void main(){ float i = pow(0.72 - dot(vN, vec3(0.0, 0.0, 1.0)), 3.0);
          gl_FragColor = vec4(0.4, 0.75, 1.0, 1.0) * i * 0.8; }`,
      side: THREE.BackSide, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false
    })
  ));

  // ---------- 未来の街(ガラスのドーム) ----------
  {
    const glass = new THREE.MeshPhongMaterial({ color: 0xd8f4ff, specular: 0xffffff, shininess: 180, transparent: true, opacity: 0.35, depthWrite: false });
    const inner = new THREE.MeshPhongMaterial({ color: 0x9be88a, shininess: 10 });
    const UPV = new THREE.Vector3(0, 1, 0);
    for (let i = 0; i < 40; i++) {
      let d;
      do { d = randDir(); } while (terrainH(d.x, d.y, d.z) < 0.25);
      const R = 3 + Math.random() * 3;
      const g = new THREE.Group();
      g.add(new THREE.Mesh(new THREE.SphereGeometry(R, 40, 20, 0, Math.PI * 2, 0, Math.PI / 2), glass));
      const floor = new THREE.Mesh(new THREE.CircleGeometry(R, 40), inner);
      floor.rotation.x = -Math.PI / 2; floor.position.y = 0.05;
      g.add(floor);
      g.quaternion.setFromUnitVectors(UPV, d);
      g.position.copy(d).multiplyScalar(surfaceR(d.x, d.y, d.z));
      scene.add(g);
    }
  }

  // ---------- UFO(銀と金の円盤、青い発光リム) ----------
  const ufo = new THREE.Group();
  ufo.rotation.order = "YXZ";
  {
    const hullPts = [
      new THREE.Vector2(0.0, 0.26),
      new THREE.Vector2(0.6, 0.36),
      new THREE.Vector2(1.3, 0.3),
      new THREE.Vector2(1.9, 0.12),
      new THREE.Vector2(2.2, 0.0),
      new THREE.Vector2(2.0, -0.08),
      new THREE.Vector2(1.2, -0.18),
      new THREE.Vector2(0.4, -0.22),
      new THREE.Vector2(0.0, -0.2)
    ];
    const hullMat = new THREE.MeshPhongMaterial({ color: 0xe9f1f8, specular: 0xffffff, shininess: 120 });
    ufo.add(new THREE.Mesh(new THREE.LatheGeometry(hullPts, 64), hullMat));

    // 銀のリング帯
    const band = new THREE.Mesh(
      new THREE.TorusGeometry(1.95, 0.1, 12, 96),
      new THREE.MeshPhongMaterial({ color: 0xf0f4f8, specular: 0xffffff, shininess: 160 })
    );
    band.rotation.x = Math.PI / 2; band.position.y = 0.12;
    ufo.add(band);

    // 青く光るリム
    const rim = new THREE.Mesh(
      new THREE.TorusGeometry(2.1, 0.05, 8, 96),
      new THREE.MeshBasicMaterial({ color: 0x3fd8ff })
    );
    rim.rotation.x = Math.PI / 2; rim.position.y = -0.04;
    ufo.add(rim);

    // コックピットのドーム
    const dome = new THREE.Mesh(
      new THREE.SphereGeometry(0.8, 40, 20, 0, Math.PI * 2, 0, Math.PI / 2),
      new THREE.MeshPhongMaterial({ color: 0xcdf3ff, specular: 0xffffff, shininess: 220, transparent: true, opacity: 0.45 })
    );
    dome.position.y = 0.26; dome.scale.set(1.0, 0.7, 1.0);
    ufo.add(dome);
  }
  ufo.scale.setScalar(0.9);
  scene.add(ufo);

  // ---------- リング(目標) ----------
  const ringGeo = new THREE.TorusGeometry(3.6, 0.28, 12, 48);
  const ringMat = new THREE.MeshBasicMaterial({ color: 0xffe066 });
  const rings = [];

  // 地表の上(5〜25)にリングを置く
  function placeRing(m) {
    let p;
    do {
      const d = randDir();
      const alt = 5 + Math.random() * 20;
      p = d.clone().multiplyScalar(surfaceR(d.x, d.y, d.z) + alt);
    } while (p.distanceTo(ufo.position) < 25);
    m.position.copy(p);
    m.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
  }
  for (let i = 0; i < 24; i++) {
    const m = new THREE.Mesh(ringGeo, ringMat);
    scene.add(m);
    rings.push(m);
    placeRing(m);
  }

  // ---------- 入力 ----------
  const keys = {};
  addEventListener("keydown", e => {
    keys[e.code] = true;
    if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) e.preventDefault();
  });
  addEventListener("keyup", e => { keys[e.code] = false; });

  const joy = { x: 0, y: 0 };
  const joyEl = document.getElementById("joy"), knob = document.getElementById("knob");
  let joyId = null;
  function joyMove(e) {
    const r = joyEl.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2, max = r.width / 2;
    let dx = e.clientX - cx, dy = e.clientY - cy;
    const len = Math.hypot(dx, dy);
    if (len > max) { dx *= max / len; dy *= max / len; }
    knob.style.transform = `translate(${dx}px,${dy}px)`;
    joy.x = dx / max; joy.y = dy / max;
  }
  joyEl.addEventListener("pointerdown", e => { joyId = e.pointerId; joyEl.setPointerCapture(e.pointerId); joyMove(e); });
  joyEl.addEventListener("pointermove", e => { if (e.pointerId === joyId) joyMove(e); });
  const joyEnd = e => {
    if (e.pointerId !== joyId) return;
    joyId = null; joy.x = 0; joy.y = 0; knob.style.transform = "";
  };
  joyEl.addEventListener("pointerup", joyEnd);
  joyEl.addEventListener("pointercancel", joyEnd);

  const joy2 = { x: 0, y: 0 };
  const joy2El = document.getElementById("joy2"), knob2 = document.getElementById("knob2");
  let joy2Id = null;
  function joy2Move(e) {
    const r = joy2El.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2, max = r.width / 2;
    let dx = e.clientX - cx, dy = e.clientY - cy;
    const len = Math.hypot(dx, dy);
    if (len > max) { dx *= max / len; dy *= max / len; }
    knob2.style.transform = `translate(${dx}px,${dy}px)`;
    joy2.x = dx / max; joy2.y = dy / max;
  }
  joy2El.addEventListener("pointerdown", e => { joy2Id = e.pointerId; joy2El.setPointerCapture(e.pointerId); joy2Move(e); });
  joy2El.addEventListener("pointermove", e => { if (e.pointerId === joy2Id) joy2Move(e); });
  const joy2End = e => {
    if (e.pointerId !== joy2Id) return;
    joy2Id = null; joy2.x = 0; joy2.y = 0; knob2.style.transform = "";
  };
  joy2El.addEventListener("pointerup", joy2End);
  joy2El.addEventListener("pointercancel", joy2End);

  // ---------- ゲーム状態 ----------
  const scoreEl = document.getElementById("score"), timeEl = document.getElementById("time"), altEl = document.getElementById("alt");
  const startEl = document.getElementById("start"), overEl = document.getElementById("over");
  const finalEl = document.getElementById("final");
  let state = "ready", timeLeft = 60, score = 0;

  // 向き・視点・上昇速度
  const heading = new THREE.Vector3(1, 0, 0);     // 機体の進行方向(地表に沿った向き)
  const camHeading = new THREE.Vector3(1, 0, 0);  // カメラの水平方向(ドラッグで回る)
  const lastUp = new THREE.Vector3(0, 0, 1);
  let camPitch = 0.35;                             // カメラの見下ろし角
  let vz = 0;

  // 右側(スティック・ボタン以外)をドラッグすると視点が回る
  let dragId = null, dragX = 0, dragY = 0;
  addEventListener("pointerdown", e => {
    if (dragId !== null || joyEl.contains(e.target) || joy2El.contains(e.target)) return;
    if (e.target.closest && e.target.closest("button")) return;
    dragId = e.pointerId; dragX = e.clientX; dragY = e.clientY;
  });
  addEventListener("pointermove", e => {
    if (e.pointerId !== dragId) return;
    const dx = e.clientX - dragX, dy = e.clientY - dragY;
    dragX = e.clientX; dragY = e.clientY;
    camHeading.applyAxisAngle(lastUp, -dx * 0.006);
    camPitch = clamp(camPitch + dy * 0.004, 0.05, 1.3);
  });
  const dragEnd = e => { if (e.pointerId === dragId) dragId = null; };
  addEventListener("pointerup", dragEnd);
  addEventListener("pointercancel", dragEnd);

  function startGame() {
    score = 0; timeLeft = 60; vz = 0;
    // 地表の少し上、地球の表側からスタート(地表に沿って飛べる向き)
    const sd = new THREE.Vector3(0, 0, 1);
    ufo.position.copy(sd).multiplyScalar(surfaceR(0, 0, 1) + 6);
    heading.set(1, 0, 0); camHeading.set(1, 0, 0); camPitch = 0.35;
    ufo.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(
      new THREE.Vector3(0, -1, 0), new THREE.Vector3(0, 0, 1), new THREE.Vector3(-1, 0, 0)));
    rings.forEach(placeRing);
    state = "playing";
    startEl.classList.add("hidden");
    overEl.classList.add("hidden");
  }
  function endGame() {
    state = "over";
    finalEl.textContent = score;
    overEl.classList.remove("hidden");
  }
  document.getElementById("startBtn").addEventListener("click", startGame);
  document.getElementById("restartBtn").addEventListener("click", startGame);
  addEventListener("keydown", e => { if (e.code === "Enter" && state !== "playing") startGame(); });

  // ---------- 更新 ----------
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const k = (...codes) => codes.some(c => keys[c]);

  // Sky風の操作: 移動はカメラの向き基準、右側のドラッグで視点を回す、Spaceで上昇
  function update(dt) {
    const ix = clamp((k("ArrowRight", "KeyD") ? 1 : 0) - (k("ArrowLeft", "KeyA") ? 1 : 0) + joy.x, -1, 1);
    const iy = clamp((k("ArrowUp", "KeyW") ? 1 : 0) - (k("ArrowDown", "KeyS") ? 1 : 0) - joy.y, -1, 1);
    const vIn = clamp((k("Space") ? 1 : 0) - (k("ShiftLeft", "ShiftRight") ? 1 : 0) - joy2.y, -1, 1);

    // 現在地の上方向(地表の法線)と、カメラの水平方向
    const pr = ufo.position.length();
    const up = ufo.position.clone().divideScalar(pr);
    lastUp.copy(up);
    const ground = surfaceR(up.x, up.y, up.z);
    const alt = pr - ground;

    const view = camHeading.clone().addScaledVector(up, -camHeading.dot(up));
    if (view.lengthSq() < 1e-6) view.set(1, 0, 0).addScaledVector(up, -up.x);
    view.normalize();
    camHeading.copy(view);
    const right = new THREE.Vector3().crossVectors(view, up);

    // 移動方向(スティック/WASDの向き)
    const moveDir = new THREE.Vector3().addScaledVector(view, iy).addScaledVector(right, ix);
    const mag = Math.min(1, moveDir.length());
    const moving = mag > 0.05;
    if (moving) moveDir.normalize();

    // 機体の向きは進行方向へ回る
    if (moving) heading.lerp(moveDir, Math.min(1, dt * 6));
    heading.addScaledVector(up, -heading.dot(up));
    if (heading.lengthSq() < 1e-6) heading.copy(view);
    heading.normalize();

    // 水平移動(球面に沿って動き、高さは保つ)
    let hs = 40 * mag;
    if (alt < 2.5) hs *= 0.5; // 地表近くはゆっくり(着陸しやすい)
    if (moving) {
      ufo.position.copy(ufo.position.clone().addScaledVector(moveDir, hs * dt).normalize().multiplyScalar(pr));
    }

    // 上昇・降下(右スティック)
    vz += (vIn * 22 - vz) * Math.min(1, dt * 4); // 右スティックで上下、離すと高度を維持
    const p2 = ufo.position.length();
    const u2 = ufo.position.clone().divideScalar(p2);
    let r2 = p2 + vz * dt;
    const minR = surfaceR(u2.x, u2.y, u2.z) + 0.45;
    if (r2 < minR) { r2 = minR; vz = 0; } // 着陸
    if (r2 > PLANET_R + 90) { r2 = PLANET_R + 90; vz = Math.min(vz, 0); }
    ufo.position.copy(u2).multiplyScalar(r2);

    // 機体の姿勢(地表の上方向を保ち、進行方向を向く)
    const u3 = ufo.position.clone().normalize();
    const fwd = heading.clone().addScaledVector(u3, -heading.dot(u3)).normalize();
    const zAxis = fwd.clone().negate();
    const xAxis = new THREE.Vector3().crossVectors(u3, zAxis).normalize();
    const targetQ = new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(xAxis, u3, zAxis));
    ufo.quaternion.slerp(targetQ, Math.min(1, dt * 8));
    ufo.updateMatrixWorld(true);

    // リング取得
    rings.forEach(m => {
      m.rotation.z += dt * 0.8;
      if (ufo.position.distanceTo(m.position) < 5.2) {
        score += 100;
        placeRing(m);
      }
    });

    // カメラ: UFOの周りを、ドラッグで決めた角度で追従(地表より下に入らない)
    const camUp = ufo.position.clone().normalize();
    const camDist = 9;
    const offset = camHeading.clone().multiplyScalar(-Math.cos(camPitch) * camDist)
      .addScaledVector(camUp, Math.sin(camPitch) * camDist);
    camera.position.lerp(ufo.position.clone().add(offset), Math.min(1, dt * 8));
    const cr = camera.position.length();
    const cd = camera.position.clone().divideScalar(cr);
    const cg = surfaceR(cd.x, cd.y, cd.z) + 0.6;
    if (cr < cg) camera.position.setLength(cg);
    camera.up.copy(camUp);
    camera.lookAt(ufo.position);

    // 時間
    timeLeft -= dt;
    if (timeLeft <= 0) { timeLeft = 0; endGame(); }
    scoreEl.textContent = score;
    timeEl.textContent = Math.ceil(timeLeft);
    altEl.textContent = alt < 0.9 ? "着陸中" : "ALT " + Math.round(alt * 10) / 10;
  }

  // ---------- 描画ループ ----------
  const clock = new THREE.Clock();
  let elapsed = 0;
  function loop() {
    requestAnimationFrame(loop);
    const dt = Math.min(clock.getDelta(), 0.05);
    elapsed += dt;


    if (state === "playing") {
      update(dt);
    } else {
      // 待機中は地球の周りをゆっくり回るカメラ
      camera.position.set(Math.sin(elapsed * 0.15) * 560, 180, Math.cos(elapsed * 0.15) * 560);
      camera.lookAt(0, 0, 0);
    }
    renderer.render(scene, camera);
  }
  loop();

  // ---------- ユーティリティ ----------
  function randDir() {
    const v = new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5);
    if (v.lengthSq() < 0.01) v.set(0, 1, 0);
    return v.normalize();
  }

  addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
})();
</script>
</body>
