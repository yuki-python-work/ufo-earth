<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UFO Earth">
<meta name="theme-color" content="#3d8fe6">
<title>UFO Earth</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#fff;
    font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent;}
  canvas{display:block;position:fixed;inset:0;}
  #hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;
    padding:calc(env(safe-area-inset-top) + 12px) 18px 0;font-size:18px;font-weight:700;
    text-shadow:0 1px 6px rgba(0,60,120,.7);pointer-events:none;}
  #rot{position:fixed;top:calc(env(safe-area-inset-top) + 44px);left:0;right:0;text-align:center;
    font-size:13px;opacity:.8;display:none;pointer-events:none;text-shadow:0 1px 4px rgba(0,60,120,.7);}
  @media (orientation:portrait){#rot{display:block;}}
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;
    background:rgba(10,40,80,.55);text-align:center;padding:24px;box-sizing:border-box;overflow-y:auto;
    -webkit-overflow-scrolling:touch;touch-action:pan-y;}
  @media (max-height:500px){
    .overlay{padding:12px 24px;}
    .overlay h1{font-size:28px;margin:0 0 4px;}
    .overlay p{margin:4px 0;line-height:1.5;font-size:14px;}
    .overlay button{font-size:17px;padding:9px 30px;margin-top:10px;}
  }
  .overlay h1{font-size:44px;letter-spacing:5px;margin:0 0 10px;color:#fff;text-shadow:0 2px 14px #0a3c78;}
  .overlay p{margin:8px 0;line-height:1.7;max-width:420px;text-shadow:0 1px 6px #0a3c78;}
  .small{font-size:13px;opacity:.8;}
  button{font-size:20px;padding:12px 40px;border-radius:30px;border:1px solid #fff;
    background:rgba(255,255,255,.2);color:#fff;margin-top:18px;touch-action:manipulation;}
  .hidden{display:none !important;}
  #joy{position:fixed;right:24px;bottom:calc(env(safe-area-inset-bottom) + 28px);width:130px;height:130px;
    border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(255,255,255,.12);}
  #knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;
    background:rgba(255,255,255,.45);pointer-events:none;}
  #boost{position:fixed;left:24px;bottom:calc(env(safe-area-inset-bottom) + 40px);width:96px;height:96px;
    border-radius:50%;border:2px solid rgba(255,255,255,.8);background:rgba(255,255,255,.2);color:#fff;
    font-size:16px;font-weight:700;margin:0;padding:0;}
  #boost.on{background:rgba(255,255,255,.55);}
</style>
</head>
<body>

<div id="hud">
  <div>SCORE <span id="score">0</span></div>
  <div id="alt">ALT 0</div>
  <div>TIME <span id="time">60</span></div>
</div>
<div id="rot">横向きにするとプレイしやすくなります</div>

<div id="joy"><div id="knob"></div></div>
<button id="boost">前進</button>

<div id="start" class="overlay">
  <h1>UFO EARTH</h1>
  <p>美しい未来の地球を飛び回り、光るリングを集めよう。地上に降りることもできます。</p>
  <p>左のスティック: 向きと上昇・降下　右の「前進」ボタン: 押している間だけ前進<br>
     PC: WASD / 矢印キーで向き、Spaceを押している間だけ前進</p>
  <p class="small">ホーム画面に追加すると全画面で遊べます</p>
  <button id="startBtn">スタート</button>
</div>

<div id="over" class="overlay hidden">
  <h1>TIME UP</h1>
  <p>スコア <span id="final" style="font-size:32px;color:#ffe066">0</span></p>
  <button id="restartBtn">もう一度</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  // ---------- 基本セットアップ ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  document.body.prepend(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.05, 1000);

  scene.add(new THREE.AmbientLight(0xffffff, 0.45));
  scene.add(new THREE.HemisphereLight(0xcfeaff, 0x5a8a3a, 0.6));
  const sun = new THREE.DirectionalLight(0xfff6e6, 1.4);
  sun.position.set(600, 400, 300);
  scene.add(sun);

  // ---------- 空(グラデーションのドーム) ----------
  scene.add(new THREE.Mesh(
    new THREE.SphereGeometry(900, 32, 16),
    new THREE.ShaderMaterial({
      vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
      fragmentShader: `varying vec3 vP;
        void main(){
          float h = normalize(vP).y;
          vec3 horizon = vec3(0.80, 0.93, 1.0);
          vec3 zenith  = vec3(0.22, 0.52, 0.96);
          float t = smoothstep(-0.05, 0.6, h);
          gl_FragColor = vec4(mix(horizon, zenith, t), 1.0);
        }`,
      side: THREE.BackSide, depthWrite: false
    })
  ));

  // ---------- 地形ノイズ ----------
  function noise3(x, y, z) {
    return Math.sin(x * 1.7 + Math.sin(y * 2.1 + z * 1.3) * 1.6) * 0.5
         + Math.sin(y * 2.9 + Math.sin(z * 1.9 + x * 2.3) * 1.4) * 0.3
         + Math.sin(z * 3.9 + Math.sin(x * 3.1 + y * 1.7) * 1.2) * 0.15
         + Math.cos(x * 5.3 + y * 4.1 - z * 3.3) * 0.08;
  }

  // 地球の大きさ: UFOの約10倍の直径(半径100)
  const PLANET_R = 100;
  const HS = 10;          // 起伏のスケール(地球の大きさに合わせる)

  // 単位方向ベクトルの地表の高さ(海は負)、UFOの単位に換算する前の値
  function terrainH(x, y, z) {
    const n = noise3(x * 2.2, y * 2.2, z * 2.2);
    if (n < 0.05) return -0.3 + noise3(x * 9, y * 9, z * 9) * 0.05;
    const base = (n - 0.05) * 0.8;
    const detail = noise3(x * 12, y * 12, z * 12) * 0.12 + noise3(x * 30, y * 30, z * 30) * 0.03;
    return 0.05 + base + detail;
  }
  // 地表の半径(中心からの距離)
  function surfaceR(x, y, z) {
    const l = Math.hypot(x, y, z);
    return PLANET_R + terrainH(x / l, y / l, z / l) * HS;
  }

  // 高さに応じた色(砂浜・草原・深い緑・岩肌・雪)
  function colorFor(h, x, y, z) {
    const v = 0.92 + 0.08 * noise3(x * 25, y * 25, z * 25);
    let r, g, b;
    if (h < 0.12)      { r = 232; g = 214; b = 160; }
    else if (h < 0.6)  { r = 118; g = 206; b = 72; }
    else if (h < 0.95) { r = 72;  g = 160; b = 60; }
    else if (h < 1.25) { r = 140; g = 120; b = 96; }
    else               { r = 240; g = 244; b = 250; }
    return [r * v / 255, g * v / 255, b * v / 255];
  }

  // ---------- 地球(高精細な地形メッシュ) ----------
  const earthGeo = new THREE.SphereGeometry(1, 480, 480);
  {
    const p = earthGeo.attributes.position;
    const col = new Float32Array(p.count * 3);
    for (let i = 0; i < p.count; i++) {
      let x = p.getX(i), y = p.getY(i), z = p.getZ(i);
      const l = Math.hypot(x, y, z); x /= l; y /= l; z /= l;
      const h = terrainH(x, y, z);
      const R = PLANET_R + Math.max(h * HS, -0.3 * HS);
      p.setXYZ(i, x * R, y * R, z * R);
      col.set(colorFor(h, x, y, z), i * 3);
    }
    p.needsUpdate = true;
    earthGeo.setAttribute("color", new THREE.BufferAttribute(col, 3));
    earthGeo.computeVertexNormals();
  }
  const earth = new THREE.Mesh(earthGeo, new THREE.MeshPhongMaterial({ vertexColors: true, shininess: 8, specular: 0x222222 }));
  scene.add(earth);

  // 海面
  const sea = new THREE.Mesh(
    new THREE.SphereGeometry(PLANET_R, 256, 256),
    new THREE.MeshPhongMaterial({ color: 0x1e9ad6, transparent: true, opacity: 0.8, shininess: 90, specular: 0xbfe9ff })
  );
  scene.add(sea);

  // 雲
  const cloudCanvas = (() => {
    const W = 1536, H = 768;
    const c = document.createElement("canvas"); c.width = W; c.height = H;
    const ctx = c.getContext("2d"); const img = ctx.createImageData(W, H);
    for (let y = 0; y < H; y++) {
      const lat = Math.PI * (0.5 - y / H), cl = Math.cos(lat), sl = Math.sin(lat);
      for (let x = 0; x < W; x++) {
        const lon = 2 * Math.PI * x / W;
        const px = cl * Math.cos(lon), py = sl, pz = cl * Math.sin(lon);
        const cn = noise3(px * 3.4 + 5.1, py * 3.4 - 2.2, pz * 3.4 + 1.3) + 0.5 * noise3(px * 7.3, py * 7.3 + 4, pz * 7.3);
        const a = Math.max(0, Math.min(1, (cn - 0.25) * 2.4));
        const i = (y * W + x) * 4;
        img.data[i] = 255; img.data[i + 1] = 255; img.data[i + 2] = 255; img.data[i + 3] = Math.round(a * 220);
      }
    }
    ctx.putImageData(img, 0, 0);
    return c;
  })();
  const clouds = new THREE.Mesh(
    new THREE.SphereGeometry(PLANET_R + 14, 160, 160),
    new THREE.MeshLambertMaterial({ map: new THREE.CanvasTexture(cloudCanvas), transparent: true, depthWrite: false })
  );
  scene.add(clouds);

  // 大気の輝き
  scene.add(new THREE.Mesh(
    new THREE.SphereGeometry(PLANET_R + 24, 64, 64),
    new THREE.ShaderMaterial({
      vertexShader: `varying vec3 vN;
        void main(){ vN = normalize(normalMatrix * normal);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `varying vec3 vN;
        void main(){ float i = pow(0.72 - dot(vN, vec3(0.0, 0.0, 1.0)), 3.0);
          gl_FragColor = vec4(0.4, 0.75, 1.0, 1.0) * i * 0.8; }`,
      side: THREE.BackSide, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false
    })
  ));

  // ---------- UFO(銀と金の円盤、青い発光リム) ----------
  const ufo = new THREE.Group();
  ufo.rotation.order = "YXZ";
  {
    const hullPts = [
      new THREE.Vector2(0.0, 0.26),
      new THREE.Vector2(0.6, 0.36),
      new THREE.Vector2(1.3, 0.3),
      new THREE.Vector2(1.9, 0.12),
      new THREE.Vector2(2.2, 0.0),
      new THREE.Vector2(2.0, -0.08),
      new THREE.Vector2(1.2, -0.18),
      new THREE.Vector2(0.4, -0.22),
      new THREE.Vector2(0.0, -0.2)
    ];
    const hullMat = new THREE.MeshPhongMaterial({ color: 0xd8c58a, specular: 0xffffff, shininess: 140 });
    ufo.add(new THREE.Mesh(new THREE.LatheGeometry(hullPts, 64), hullMat));

    // 銀のリング帯
    const band = new THREE.Mesh(
      new THREE.TorusGeometry(1.95, 0.1, 12, 96),
      new THREE.MeshPhongMaterial({ color: 0xf0f4f8, specular: 0xffffff, shininess: 160 })
    );
    band.rotation.x = Math.PI / 2; band.position.y = 0.12;
    ufo.add(band);

    // 青く光るリム
    const rim = new THREE.Mesh(
      new THREE.TorusGeometry(2.1, 0.05, 8, 96),
      new THREE.MeshBasicMaterial({ color: 0x66ccff })
    );
    rim.rotation.x = Math.PI / 2; rim.position.y = -0.04;
    ufo.add(rim);

    // コックピットのドーム
    const dome = new THREE.Mesh(
      new THREE.SphereGeometry(0.8, 40, 20, 0, Math.PI * 2, 0, Math.PI / 2),
      new THREE.MeshPhongMaterial({ color: 0x9fe6ff, specular: 0xffffff, shininess: 200, transparent: true, opacity: 0.6 })
    );
    dome.position.y = 0.26; dome.scale.set(1.0, 0.7, 1.0);
    ufo.add(dome);
  }
  ufo.scale.setScalar(0.9);
  scene.add(ufo);

  // ---------- リング(目標) ----------
  const ringGeo = new THREE.TorusGeometry(1.8, 0.14, 12, 40);
  const ringMat = new THREE.MeshBasicMaterial({ color: 0xffe066 });
  const rings = [];

  // 地表の上(5〜25)にリングを置く
  function placeRing(m) {
    let p;
    do {
      const d = randDir();
      const alt = 5 + Math.random() * 20;
      p = d.clone().multiplyScalar(surfaceR(d.x, d.y, d.z) + alt);
    } while (p.distanceTo(ufo.position) < 25);
    m.position.copy(p);
    m.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
  }
  for (let i = 0; i < 12; i++) {
    const m = new THREE.Mesh(ringGeo, ringMat);
    scene.add(m);
    rings.push(m);
    placeRing(m);
  }

  // ---------- 入力 ----------
  const keys = {};
  addEventListener("keydown", e => {
    keys[e.code] = true;
    if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) e.preventDefault();
  });
  addEventListener("keyup", e => { keys[e.code] = false; });

  const joy = { x: 0, y: 0 };
  const joyEl = document.getElementById("joy"), knob = document.getElementById("knob");
  let joyId = null;
  function joyMove(e) {
    const r = joyEl.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2, max = r.width / 2;
    let dx = e.clientX - cx, dy = e.clientY - cy;
    const len = Math.hypot(dx, dy);
    if (len > max) { dx *= max / len; dy *= max / len; }
    knob.style.transform = `translate(${dx}px,${dy}px)`;
    joy.x = dx / max; joy.y = dy / max;
  }
  joyEl.addEventListener("pointerdown", e => { joyId = e.pointerId; joyEl.setPointerCapture(e.pointerId); joyMove(e); });
  joyEl.addEventListener("pointermove", e => { if (e.pointerId === joyId) joyMove(e); });
  const joyEnd = e => {
    if (e.pointerId !== joyId) return;
    joyId = null; joy.x = 0; joy.y = 0; knob.style.transform = "";
  };
  joyEl.addEventListener("pointerup", joyEnd);
  joyEl.addEventListener("pointercancel", joyEnd);

  let touchBoost = false;
  const boostEl = document.getElementById("boost");
  const boostOn = e => { e.preventDefault(); touchBoost = true; boostEl.classList.add("on"); };
  const boostOff = () => { touchBoost = false; boostEl.classList.remove("on"); };
  boostEl.addEventListener("pointerdown", boostOn);
  boostEl.addEventListener("pointerup", boostOff);
  boostEl.addEventListener("pointercancel", boostOff);
  boostEl.addEventListener("pointerleave", boostOff);

  // ---------- ゲーム状態 ----------
  const scoreEl = document.getElementById("score"), timeEl = document.getElementById("time"), altEl = document.getElementById("alt");
  const startEl = document.getElementById("start"), overEl = document.getElementById("over");
  const finalEl = document.getElementById("final");
  let state = "ready", timeLeft = 60, score = 0, speed = 0;

  function startGame() {
    score = 0; timeLeft = 60; speed = 0;
    // 地表の少し上、地球の表側からスタート(地表に沿って飛べる向き)
    const sd = new THREE.Vector3(0, 0, 1);
    ufo.position.copy(sd).multiplyScalar(surfaceR(0, 0, 1) + 6);
    ufo.rotation.set(0, Math.PI / 2, 0);
    rings.forEach(placeRing);
    state = "playing";
    startEl.classList.add("hidden");
    overEl.classList.add("hidden");
  }
  function endGame() {
    state = "over";
    finalEl.textContent = score;
    overEl.classList.remove("hidden");
  }
  document.getElementById("startBtn").addEventListener("click", startGame);
  document.getElementById("restartBtn").addEventListener("click", startGame);
  addEventListener("keydown", e => { if (e.code === "Enter" && state !== "playing") startGame(); });

  // ---------- 更新 ----------
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const k = (...codes) => codes.some(c => keys[c]);

  function update(dt) {
    const turn = clamp((k("ArrowRight", "KeyD") ? 1 : 0) - (k("ArrowLeft", "KeyA") ? 1 : 0) + joy.x, -1, 1);
    const climb = clamp((k("ArrowUp", "KeyW") ? 1 : 0) - (k("ArrowDown", "KeyS") ? 1 : 0) - joy.y, -1, 1);

    ufo.rotation.y -= turn * dt * 2.2;
    ufo.rotation.x = clamp(ufo.rotation.x + climb * dt * 0.9, -1.0, 1.0);
    ufo.rotation.z += (-turn * 0.6 - ufo.rotation.z) * Math.min(1, dt * 4);

    // 地表からの高さ
    const pr = ufo.position.length();
    const dir = ufo.position.clone().divideScalar(pr);
    const ground = surfaceR(dir.x, dir.y, dir.z);
    const alt = pr - ground;

    // スペースキー(またはBOOSTボタン)を押している間だけ前進
    const forward = k("Space") || touchBoost;
    let target = forward ? 40 : 0;
    if (alt < 2.5) target *= 0.5; // 地表近くはゆっくり(着陸しやすい)
    speed += (target - speed) * Math.min(1, dt * (forward ? 3 : 5));
    ufo.translateZ(-speed * dt);

    // 地形にぶつからない(地表で止まる)、遠くに行きすぎない
    const r2 = ufo.position.length();
    const d2 = ufo.position.clone().divideScalar(r2);
    const g2 = surfaceR(d2.x, d2.y, d2.z);
    const minR = g2 + 0.45;
    if (r2 < minR) ufo.position.multiplyScalar(minR / r2);
    if (r2 > PLANET_R + 90) ufo.position.multiplyScalar((PLANET_R + 90) / r2);
    ufo.updateMatrixWorld(true);

    // リング取得
    rings.forEach(m => {
      m.rotation.z += dt * 0.8;
      if (ufo.position.distanceTo(m.position) < 2.6) {
        score += 100;
        placeRing(m);
      }
    });

    // カメラ追従(地表より下に入らない)
    const camTarget = new THREE.Vector3(0, 2.2, 7).applyMatrix4(ufo.matrixWorld);
    camera.position.lerp(camTarget, Math.min(1, dt * 5));
    const cr = camera.position.length();
    const cd = camera.position.clone().divideScalar(cr);
    const cg = surfaceR(cd.x, cd.y, cd.z) + 0.6;
    if (cr < cg) camera.position.setLength(cg);
    camera.lookAt(new THREE.Vector3(0, 0, -8).applyMatrix4(ufo.matrixWorld));

    // 時間
    timeLeft -= dt;
    if (timeLeft <= 0) { timeLeft = 0; endGame(); }
    scoreEl.textContent = score;
    timeEl.textContent = Math.ceil(timeLeft);
    altEl.textContent = alt < 0.9 ? "着陸中" : "ALT " + Math.round(alt * 10) / 10;
  }

  // ---------- 描画ループ ----------
  const clock = new THREE.Clock();
  let elapsed = 0;
  function loop() {
    requestAnimationFrame(loop);
    const dt = Math.min(clock.getDelta(), 0.05);
    elapsed += dt;

    clouds.rotation.y += dt * 0.035;

    if (state === "playing") {
      update(dt);
    } else {
      // 待機中は地球の周りをゆっくり回るカメラ
      camera.position.set(Math.sin(elapsed * 0.15) * 340, 90, Math.cos(elapsed * 0.15) * 340);
      camera.lookAt(0, 0, 0);
    }
    renderer.render(scene, camera);
  }
  loop();

  // ---------- ユーティリティ ----------
  function randDir() {
    const v = new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5);
    if (v.lengthSq() < 0.01) v.set(0, 1, 0);
    return v.normalize();
  }

  addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
})();
</script>
</body>
</html>
